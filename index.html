<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#063a7a">
<meta name="description" content="Pop the corporate buzzwords before they float away. Don't pop the sea friends.">
<meta property="og:type" content="website">
<meta property="og:title" content="Buzzword Bubbles">
<meta property="og:description" content="Pop the corporate buzzwords before they float away. Don't pop the sea friends.">
<title>Buzzword Bubbles</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  color-scheme:dark;
  --serif:"Fredoka","Trebuchet MS",system-ui,sans-serif;
  --sans:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --cream:#F4FBFF;
  --gold:#FFE27A;
  --ink:#06365F;
  --st:env(safe-area-inset-top,0px);
  --sr:env(safe-area-inset-right,0px);
  --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{
  position:fixed;inset:0;width:100%;height:100%;overflow:hidden;
  overscroll-behavior:none;background:#063a7a;color:var(--cream);
  font-family:var(--sans);-webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;-webkit-text-size-adjust:100%;
}
#game{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{
  position:fixed;inset:0;pointer-events:none;
  padding:calc(14px + var(--st)) calc(20px + var(--sr)) 0 calc(20px + var(--sl));
  display:flex;justify-content:space-between;align-items:flex-start;
  opacity:0;transition:opacity .4s ease;
}
#hud.show{opacity:1}
#score{display:inline-block;transform-origin:left top;transition:transform .1s ease-out;font-family:var(--serif);font-weight:600;text-shadow:0 3px 0 rgba(4,58,110,.35);font-size:clamp(52px,11vw,76px);line-height:.95;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
#hudRight{display:flex;flex-direction:column;align-items:flex-end;gap:8px;padding-top:12px}
#lives{display:flex;gap:9px;align-items:center}
#lives::before{content:"Lives";font:600 10.5px var(--sans);letter-spacing:.2em;text-transform:uppercase;margin-right:4px}
#lives i{
  width:13px;height:13px;border-radius:50%;
  border:1.5px solid rgba(244,251,255,.85);background:var(--cream);
  transition:background .35s ease,border-color .35s ease;
}
#lives i.lost{background:transparent;border-color:rgba(244,251,255,.38)}
#mult{font-family:var(--serif);font-style:normal;font-size:26px;line-height:1;color:var(--gold)}

#levelLabel{
  position:fixed;left:0;right:0;top:calc(22% + var(--st));text-align:center;pointer-events:none;
  font-size:18px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;
  color:rgba(244,251,255,.96);text-shadow:0 2px 10px rgba(4,58,110,.8);opacity:0;transition:opacity .7s ease;
}
#levelLabel.show{opacity:1}

#sound{
  position:fixed;left:calc(14px + var(--sl));bottom:calc(12px + var(--sb));z-index:5;
  background:rgba(4,58,110,.62);border:0;border-radius:999px;color:rgba(244,251,255,.92);cursor:pointer;
  font:500 10.5px var(--sans);letter-spacing:.24em;text-transform:uppercase;
  padding:10px 14px;display:flex;align-items:center;gap:8px;
}
#sound:hover,#sound:focus-visible{color:rgba(244,251,255,.9);outline:none}
#sound svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#sound .waves{transition:opacity .2s}
#sound.off .waves{opacity:0}
#sound .slash{opacity:0}
#sound.off .slash{opacity:1}

/* ---------- Cards ---------- */
.overlay{
  position:fixed;inset:0;z-index:3;display:flex;align-items:center;justify-content:center;
  padding:calc(16px + var(--st)) calc(16px + var(--sr)) calc(16px + var(--sb)) calc(16px + var(--sl));
  opacity:0;pointer-events:none;transition:opacity .5s ease;
}
.overlay.show{opacity:1;pointer-events:auto}
.card{
  width:min(100%,400px);max-height:100%;text-align:center;
  padding:38px 30px 30px;border-radius:30px;
  background:rgba(4,58,110,.46);
  border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(22px) saturate(125%);backdrop-filter:blur(22px) saturate(125%);
  box-shadow:0 30px 80px rgba(0,0,0,.42),inset 0 1px 0 rgba(255,255,255,.14);
  transform:translateY(10px);transition:transform .6s cubic-bezier(.2,.7,.2,1);
}
.overlay.show .card{transform:none}
.eyebrow{font-size:10.5px;font-weight:500;letter-spacing:.32em;text-transform:uppercase;color:rgba(244,251,255,.58)}
h1{font-family:var(--serif);font-weight:600;font-size:clamp(42px,12vw,56px);line-height:1;margin:12px 0 26px;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--gold)}
.rules{list-style:none;text-align:left;display:grid;gap:14px;margin:0 auto 30px;width:fit-content;max-width:100%}
.rules li{display:flex;align-items:center;gap:14px;font-size:14.5px;color:rgba(244,251,255,.88);line-height:1.25}
.sb{
  flex:none;width:30px;height:30px;border-radius:50%;border:1px solid rgba(255,255,255,.62);
  background:
    radial-gradient(circle at 31% 27%,rgba(255,255,255,.6) 0,rgba(255,255,255,0) 30%),
    radial-gradient(circle,rgba(var(--t),.07) 35%,rgba(var(--t),.4) 100%);
}
.sb.lilac{--t:200,240,255}
.sb.blush{--t:150,226,255}
.sb.goldb{border-color:#fff;background:radial-gradient(circle at 31% 27%,#fff8c9 0,#ffd84a 50%,#f0a81e 100%)}
.sb.white{border-color:#fff;background:radial-gradient(circle at 35% 30%,#fff 0,#eaf8ff 60%,#bfe6ff 100%);box-shadow:0 0 14px rgba(255,255,255,.75)}
.btn{
  appearance:none;border:1px solid var(--gold);background:var(--gold);color:var(--ink);cursor:pointer;
  font:600 12px var(--sans);letter-spacing:.26em;text-transform:uppercase;
  padding:16px 34px;border-radius:999px;min-width:190px;
  transition:transform .2s ease,background .2s ease,color .2s ease;
}
.btn:hover{background:#fff0b0}
.btn:active{transform:scale(.97)}
.btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
.btn.ghost{background:transparent;color:var(--cream);border-color:rgba(244,251,255,.36)}
.btn.ghost:hover{background:rgba(255,255,255,.07)}
.final{font-family:var(--serif);font-size:clamp(76px,22vw,104px);line-height:.95;margin:8px 0 2px;font-variant-numeric:tabular-nums}
.rank{font-family:var(--serif);font-style:normal;font-size:clamp(24px,7vw,30px);line-height:1.1;color:var(--gold);margin-bottom:24px}
.stats{display:flex;justify-content:center;gap:44px;margin-bottom:28px}
.stats b{display:block;font-family:var(--serif);font-weight:400;font-size:34px;line-height:1.1;margin-top:4px}
.actions{display:flex;flex-direction:column;align-items:center;gap:12px}

@media (max-height:560px){
  .card{padding:20px 26px 18px;width:min(100%,520px)}
  h1{font-size:36px;margin:6px 0 14px}
  .rules{gap:8px;margin-bottom:16px;grid-template-columns:1fr 1fr;column-gap:22px}
  .rules li{font-size:13px}
  .sb{width:24px;height:24px}
  .btn{padding:12px 28px}
  .final{font-size:58px}
  .rank{font-size:22px;margin-bottom:10px}
  .stats{margin-bottom:14px}
  .stats b{font-size:26px}
  .actions{flex-direction:row;justify-content:center}
  .btn{min-width:150px}
}
@media (prefers-reduced-motion:reduce){
  *{transition-duration:.01ms!important}
  .card{transform:none}
}
</style>
</head>
<body>

<canvas id="game" aria-label="Buzzword Bubbles game"></canvas>

<div id="hud" aria-hidden="true">
  <div id="score">0</div>
  <div id="hudRight">
    <div id="lives"><i></i><i></i><i></i></div>
    <div id="mult">&times;1</div>
  </div>
</div>
<div id="levelLabel" aria-hidden="true"></div>

<div class="overlay show" id="startScreen">
  <div class="card">
    <div class="eyebrow">Pop the jargon. Save the sea.</div>
    <h1>Buzzword <em>Bubbles</em></h1>
    <ul class="rules">
      <li><span class="sb lilac"></span>Pop every buzzword you see</li>
      <li><span class="sb blush"></span>Let one escape, lose a life</li>
      <li><span class="sb goldb"></span>Don't pop the sea friends</li>
      <li><span class="sb white"></span>The pearl clears the screen</li>
    </ul>
    <button class="btn" id="playBtn" type="button">Play</button>
  </div>
</div>

<div class="overlay" id="overScreen">
  <div class="card">
    <div class="eyebrow">Final score</div>
    <div class="final" id="finalScore">0</div>
    <div class="rank" id="rank"></div>
    <div class="stats">
      <div class="eyebrow">Level<b id="finalLevel">1</b></div>
      <div class="eyebrow">Best<b id="bestScore">0</b></div>
    </div>
    <div class="actions">
      <button class="btn" id="againBtn" type="button">Play again</button>
      <button class="btn ghost" id="copyBtn" type="button">Copy score</button>
    </div>
  </div>
</div>

<button id="sound" type="button" aria-pressed="true" aria-label="Toggle sound">
  <svg viewBox="0 0 24 24" aria-hidden="true">
    <path d="M4 9.5v5h3.5L12 18V6L7.5 9.5H4z"/>
    <path class="waves" d="M15.5 9.2a4 4 0 0 1 0 5.6M18 6.8a7.5 7.5 0 0 1 0 10.4"/>
    <path class="slash" d="M16 9.5l5 5M21 9.5l-5 5"/>
  </svg>
  <span id="soundLabel">Sound on</span>
</button>

<script>
'use strict';

/* ================= Content ================= */
const BUZZWORDS = [
  'circling back','just following up','per my last email','hope this finds you well','quick question',
  'touch base','synergy','low-hanging fruit','move the needle','deep dive','bandwidth','take this offline',
  'thought leader','game changer','10x','leverage','pivot','disrupt','AI-powered','at scale','best-in-class',
  'seamless','robust','value add','win-win','action items','stakeholders','deliverables','KPIs','ROI','ASAP',
  'EOD','ping me','loop me in','hop on a call','quick sync',"let's align",'going forward','as discussed',
  'gentle reminder','friendly nudge','bumping this','any updates?','thoughts?','pick your brain',
  'put a pin in it','north star','growth hacking','ecosystem','paradigm shift',
  'think outside the box','at the end of the day','new normal','pain point','secret sauce','quick win',
  'big picture','next steps','reach out','on my radar',
  'top of mind','buy-in','empower','frictionless','holistic','scalable','mission critical',
  'hit the ground running','in the weeds','heavy lifting','giving 110%','humbled to announce',
  'excited to share','thrilled to announce','agentic','just checking in','does that make sense?',
  "let's connect",'quick call?','15 minutes?','revolutionary','cutting-edge','world-class','unlock',
  'supercharge','streamline','best practice','key takeaways',
  'no-brainer','value prop'

];
const PLAIN = [
  'Yes','No',"Here's the price",'Signed','Done','Thanks','I was wrong','It ships Friday',
  "I don't know",'Approved','Not now','Paid','Fixed',"I'll call you",'Agreed'
];
const RANKS = [
  [0,   'Still circling back'],
  [20,  'Meeting Survivor'],
  [60,  'Jargon Slayer'],
  [140, 'Straight Talker'],
  [280, 'Chief No-Nonsense Officer']
];
const TINTS = {
  aqua: [170,232,255],
  foam: [220,246,255],
  sky:  [140,210,255],
  mint: [165,242,232]
};
const TINT_KEYS = Object.keys(TINTS);

/* ================= Tunables ================= */
const START_INTERVAL = 0.8, MIN_INTERVAL = 0.26;
const START_SPEED = 115, MAX_SPEED = 720;
const LEVEL_SECONDS = 6;
const MAX_BUBBLES = 14;
const GOLD_CHANCE = 1 / 8;
const MIN_D = 90, MAX_D = 130;
const BASE = 130, PAD = 6;
const SANS = '"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
const SERIF = '"Fredoka","Trebuchet MS",system-ui,sans-serif';

/* ================= Setup ================= */
const $ = id => document.getElementById(id);
const cv = $('game'), ctx = cv.getContext('2d');
const mctx = document.createElement('canvas').getContext('2d');
const el = {
  hud: $('hud'), score: $('score'), lives: [...$('lives').children], mult: $('mult'),
  level: $('levelLabel'), start: $('startScreen'), over: $('overScreen'),
  finalScore: $('finalScore'), rank: $('rank'), finalLevel: $('finalLevel'), best: $('bestScore'),
  sound: $('sound'), soundLabel: $('soundLabel'), copy: $('copyBtn')
};

let W = 0, H = 0, DPR = 0;
let bgCanvas = null, baseSprites = {}, glowSprite = null;

const rmq = window.matchMedia ? window.matchMedia('(prefers-reduced-motion: reduce)') : null;
let reduced = !!(rmq && rmq.matches);
if (rmq) {
  const onRm = e => { reduced = e.matches; };
  if (rmq.addEventListener) rmq.addEventListener('change', onRm); else if (rmq.addListener) rmq.addListener(onRm);
}

const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function store(key, val) {
  try {
    if (val === undefined) return localStorage.getItem(key);
    localStorage.setItem(key, val);
  } catch (e) {}
  return null;
}

/* ================= State ================= */
let state = 'start';            // start | play | over
let bubbles = [], pops = [], rings = [], drops = [], floats = [], shards = [], shake = 0;
let score = 0, lives = 3, streak = 0, mult = 1, level = 1;
let best = parseInt(store('bb_best'), 10) || 0;
let T = 0, playT = 0, spawnT = 0, replyT = 20;
let interval = START_INTERVAL, speed = START_SPEED;
let vignette = 0, levelTimer = 0, overTimer = 0;
let bag = [], plainBag = [];

/* ================= Sprites ================= */
function makeCanvas(w, h) {
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.ceil(w)); c.height = Math.max(1, Math.ceil(h));
  return c;
}

function buildBackground() {
  bgCanvas = makeCanvas(cv.width, cv.height);
  const g = bgCanvas.getContext('2d'), w = bgCanvas.width, h = bgCanvas.height;
  const lg = g.createLinearGradient(0, 0, 0, h);
  lg.addColorStop(0, '#56d6f8');
  lg.addColorStop(0.3, '#1c9be0');
  lg.addColorStop(0.7, '#0a5fb0');
  lg.addColorStop(1, '#063a7a');
  g.fillStyle = lg; g.fillRect(0, 0, w, h);
  // sunlight falling through the water
  for (let i = 0; i < 6; i++) {
    const x0 = w * (0.06 + 0.17 * i), sp = w * 0.05, lean = w * 0.12, hh = h * 0.78;
    const rg = g.createLinearGradient(0, 0, 0, hh);
    rg.addColorStop(0, 'rgba(255,255,255,0.17)');
    rg.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = rg;
    g.beginPath(); g.moveTo(x0 - sp * 0.4, 0); g.lineTo(x0 + sp * 0.4, 0);
    g.lineTo(x0 + lean + sp * 1.7, hh); g.lineTo(x0 + lean - sp * 1.7, hh); g.closePath(); g.fill();
  }
  // seabed
  const sh = h * 0.09, u = Math.max(w, h) / 100;
  g.lineCap = 'round';
  [[0.07, 0.2, '#1fae80'], [0.14, 0.14, '#2bcf96'], [0.87, 0.17, '#2bcf96'], [0.94, 0.23, '#1fae80']].forEach(([px, ph, col]) => {
    const x = w * px, top = h - h * ph;
    g.strokeStyle = col; g.lineWidth = u * 1.2;
    g.beginPath(); g.moveTo(x, h - sh * 0.4);
    g.bezierCurveTo(x - u * 3, h - h * ph * 0.4, x + u * 3, h - h * ph * 0.7, x - u, top); g.stroke();
  });
  g.fillStyle = '#ff8fb3';
  [[0.72, 0.9, 2.4], [0.75, 1.25, 2], [0.69, 1.2, 1.7]].forEach(([px, k, r]) => {
    g.beginPath(); g.arc(w * px, h - sh * k, u * r, 0, Math.PI * 2); g.fill();
  });
  g.fillStyle = '#ecd6a4';
  g.beginPath(); g.moveTo(0, h); g.lineTo(0, h - sh * 0.7);
  g.quadraticCurveTo(w * 0.25, h - sh * 1.3, w * 0.5, h - sh * 0.75);
  g.quadraticCurveTo(w * 0.78, h - sh * 0.3, w, h - sh);
  g.lineTo(w, h); g.closePath(); g.fill();
}

function sphereSprite(kind, rgb) {
  const size = BASE + PAD * 2;
  const c = makeCanvas(size * DPR, size * DPR), g = c.getContext('2d');
  g.scale(DPR, DPR);
  const cx = size / 2, cy = size / 2, R = BASE / 2;
  g.beginPath(); g.arc(cx, cy, R, 0, Math.PI * 2);
  let hl = 0.6;
  if (kind === 'glass') {
    const t = rgb.join(',');
    g.fillStyle = 'rgba(3,52,104,0.24)'; g.fill();         // keeps text readable over the glow
    const body = g.createRadialGradient(cx, cy, R * 0.15, cx, cy, R);
    body.addColorStop(0, `rgba(${t},0.06)`);
    body.addColorStop(0.7, `rgba(${t},0.13)`);
    body.addColorStop(1, `rgba(${t},0.36)`);
    g.fillStyle = body; g.fill();
    const rim = g.createLinearGradient(cx - R, cy - R, cx + R, cy + R);
    rim.addColorStop(0, 'rgba(255,255,255,0.95)');
    rim.addColorStop(1, `rgba(${t},0.45)`);
    g.strokeStyle = rim; g.lineWidth = 2; g.stroke();
  } else if (kind === 'gold') {
    const body = g.createRadialGradient(cx - R * 0.3, cy - R * 0.35, R * 0.05, cx, cy, R);
    body.addColorStop(0, '#fff6dc');
    body.addColorStop(0.5, '#ecd29a');
    body.addColorStop(1, '#c49d55');
    g.fillStyle = body; g.fill();
    g.strokeStyle = 'rgba(255,246,222,0.95)'; g.lineWidth = 1.4; g.stroke();
    hl = 0.5;
  } else {
    const body = g.createRadialGradient(cx - R * 0.25, cy - R * 0.3, R * 0.05, cx, cy, R);
    body.addColorStop(0, '#ffffff');
    body.addColorStop(0.65, '#eefaff');
    body.addColorStop(1, '#bfe6ff');
    g.fillStyle = body; g.fill();
    g.strokeStyle = '#ffffff'; g.lineWidth = 1.6; g.stroke();
    hl = 0;
  }
  if (hl) {
    g.save();
    g.translate(cx - R * 0.36, cy - R * 0.42);
    g.rotate(-0.65); g.scale(1, 0.6);
    const h = g.createRadialGradient(0, 0, 0, 0, 0, R * 0.36);
    h.addColorStop(0, `rgba(255,255,255,${hl})`);
    h.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = h;
    g.beginPath(); g.arc(0, 0, R * 0.36, 0, Math.PI * 2); g.fill();
    g.restore();
  }
  return c;
}

function buildBaseSprites() {
  baseSprites = { gold: sphereSprite('gold'), reply: sphereSprite('reply') };
  for (const k of TINT_KEYS) baseSprites[k] = sphereSprite('glass', TINTS[k]);
  const s = 128;
  glowSprite = makeCanvas(s, s);
  const g = glowSprite.getContext('2d');
  const rg = g.createRadialGradient(s / 2, s / 2, s * 0.18, s / 2, s / 2, s / 2);
  rg.addColorStop(0, 'rgba(255,255,255,0.55)');
  rg.addColorStop(0.55, 'rgba(220,245,255,0.16)');
  rg.addColorStop(1, 'rgba(220,245,255,0)');
  g.fillStyle = rg; g.fillRect(0, 0, s, s);
}

function fontFor(kind, fs) {
  if (kind === 'gold') return `400 ${fs}px ${SERIF}`;
  if (kind === 'reply') return `600 ${fs}px ${SANS}`;
  return `500 ${fs}px ${SANS}`;
}

/* Wrap text into at most 3 lines that fit inside the circle; never below 13px. */
function fitText(text, d, kind) {
  const R = d / 2 * 0.86, words = text.split(' ');
  const sizes = kind === 'gold' ? [25, 23, 21, 19, 17, 15] : kind === 'reply' ? [15, 14, 13] : [18, 17, 16, 15, 14, 13];
  for (const fs of sizes) {
    mctx.font = fontFor(kind, fs);
    const lh = fs * 1.2;
    for (let n = 1; n <= 3; n++) {
      const lines = []; let wi = 0, ok = true;
      for (let i = 0; i < n; i++) {
        const ye = Math.abs((i - (n - 1) / 2) * lh) + fs * 0.55;
        if (ye >= R) { ok = false; break; }
        const maxW = 2 * Math.sqrt(R * R - ye * ye);
        let line = '';
        while (wi < words.length) {
          const t = line ? line + ' ' + words[wi] : words[wi];
          if (mctx.measureText(t).width <= maxW) { line = t; wi++; } else break;
        }
        if (!line) { ok = false; break; }
        lines.push(line);
      }
      if (ok && wi === words.length) return { fs, lh, lines };
    }
  }
  return null;
}

function layoutBubble(b) {
  if (b.kind === 'gold') { b.r = b.d / 2; b.fit = null; return; }
  let fit = null, d = b.d;
  while (!(fit = fitText(b.text, d, b.kind)) && d < MAX_D) d = Math.min(MAX_D, d + 8);
  if (!fit) fit = { fs: 13, lh: 15.6, lines: [b.text] };
  b.d = d; b.r = d / 2; b.fit = fit;
}

function makeSprite(b) {
  const size = b.d + PAD * 2;
  const c = makeCanvas(size * DPR, size * DPR), g = c.getContext('2d');
  g.scale(DPR, DPR);
  const s = b.d / BASE, bs = (BASE + PAD * 2) * s, off = size / 2 - bs / 2;
  g.drawImage(baseSprites[b.kind === 'reply' ? 'reply' : b.tint], off, off, bs, bs);

  for (const f of floats) { f.t += dt; f.y -= 22 * dt; }
  floats = floats.filter(f => f.t < 1.6);
  for (const p of shards) { p.t += dt; p.vy += 900 * dt; p.x += p.vx * dt; p.y += p.vy * dt; p.rot += p.vr * dt; }
  shards = shards.filter(p => p.t < p.dur);
  shake = Math.max(0, shake - 28 * dt);
}

function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(bgCanvas, 0, 0, cv.width, cv.height);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  drawSea();
  if (shake > 0.2) ctx.translate(rand(-shake, shake), rand(-shake, shake));

  for (const b of bubbles) {
    if (b.kind === 'reply') {
      const pulse = reduced ? 0.8 : 0.7 + 0.3 * Math.sin(T * 3.2);
      const gs = b.d * 2.1;
      ctx.globalAlpha = pulse;
      ctx.drawImage(glowSprite, b.x - gs / 2, b.y - gs / 2, gs, gs);
      ctx.globalAlpha = 1;
    }
    ctx.drawImage(b.sprite, b.x - b.size / 2, b.y - b.size / 2, b.size, b.size);
  }

  for (const p of pops) {
    const k = p.t / p.dur;
    const s = p.size * (p.grow && !reduced ? 1 + 0.16 * k : 1);
    ctx.globalAlpha = 1 - k;
    ctx.drawImage(p.sprite, p.x - s / 2, p.y - s / 2, s, s);
  }
  for (const r of rings) {
    const k = r.t / r.dur, e = 1 - (1 - k) * (1 - k);
    ctx.globalAlpha = r.a * (1 - k);
    ctx.strokeStyle = '#fff'; ctx.lineWidth = r.w;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r0 + (r.r1 - r.r0) * e, 0, Math.PI * 2); ctx.stroke();
  }
  for (const d of drops) {
    ctx.globalAlpha = 0.85 * (1 - d.t / d.dur);
    ctx.fillStyle = `rgb(${d.col[0]},${d.col[1]},${d.col[2]})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.globalAlpha = 1;

  ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillStyle = '#fff';
  for (const p of shards) {
    ctx.globalAlpha = 1 - p.t / p.dur;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot);
    ctx.font = '600 ' + p.fs + 'px ' + SANS; ctx.fillText(p.ch, 0, 0); ctx.restore();
  }
  ctx.font = '600 19px ' + SERIF; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
  for (const f of floats) {
    ctx.globalAlpha = Math.min(1, (1.6 - f.t) * 1.6);
    ctx.lineWidth = 5; ctx.strokeStyle = f.good ? 'rgba(4,58,110,0.9)' : 'rgba(190,30,60,0.92)';
    ctx.strokeText(f.text, f.x, f.y); ctx.fillStyle = '#fff'; ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;

  if (vignette > 0) {
    const R = Math.hypot(W, H) / 2;
    const vg = ctx.createRadialGradient(W / 2, H / 2, R * 0.45, W / 2, H / 2, R);
    vg.addColorStop(0, 'rgba(214,60,84,0)');
    vg.addColorStop(1, `rgba(214,60,84,${0.42 * vignette * vignette})`);
    ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);
  }
}

let last = 0;
function frame(ts) {
  const dt = last ? Math.min(0.05, Math.max(0, (ts - last) / 1000)) : 0;
  last = ts;
  update(dt); draw();
  requestAnimationFrame(frame);
}

/* ================= Resize & boot ================= */
function resize() {
  const d = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.round(W * d); cv.height = Math.round(H * d);
  if (d !== DPR) {
    DPR = d;
    buildBaseSprites();
    bubbles.forEach(makeSprite);
  }
  buildBackground();
  seedSea();
  for (const b of bubbles) {
    const edge = b.r + b.amp + 6;
    b.x0 = clamp(b.x0, edge, Math.max(edge, W - edge));
  }
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

function refreshText() {            // web fonts arrived: re-measure and redraw labels
  for (const b of bubbles) { layoutBubble(b); makeSprite(b); }
}
try {
  if (document.fonts && document.fonts.load) {
    Promise.all([
      document.fonts.load('500 16px "Instrument Sans"'),
      document.fonts.load('600 16px "Instrument Sans"'),
      document.fonts.load('500 20px "Fredoka"')
    ]).then(refreshText, () => {});
  }
} catch (e) {}

setSound(soundOn);
resize();
// A few bubbles already adrift behind the start card.
for (let i = 0; i < 4; i++) {
  if (trySpawn()) { const b = bubbles[bubbles.length - 1]; b.y = H * (0.25 + 0.22 * i) + rand(-20, 20); }
}
spawnT = 1;
requestAnimationFrame(frame);
</script>

</body>
</html>
